name: 发布精选笔记到 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查发布范围
        run: node --test scripts/publication.test.mjs
      - name: 导出公开文章
        run: node scripts/publication.mjs
      - name: 构建网站
        run: npx quartz build -d .publish-content
      - name: 检查生成结果
        run: node scripts/verify-publication.mjs
      - name: 上传网站
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4
